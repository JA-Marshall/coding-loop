<text x="24" y="34" class="b s15">Inner loop: one packet</text>
<text x="936" y="34" class="e mu mono s11">runner.py</text>
<text x="90.0" y="134" class="mono b s12 c ca">IMPLEMENT</text>
<text x="90.0" y="76" class="mu s11 c">worker model,</text>
<text x="90.0" y="91" class="mu s11 c">fresh process</text>
<text x="246.0" y="134" class="mono b s12 c">APPLYING</text>
<text x="246.0" y="76" class="mu s11 c">patch applied to</text>
<text x="246.0" y="91" class="mu s11 c">the owned files only</text>
<text x="402.0" y="134" class="mono b s12 c">CHECKS</text>
<text x="402.0" y="76" class="mu s11 c">prescribed commands:</text>
<text x="402.0" y="91" class="mu s11 c">tests, validator</text>
<text x="558.0" y="134" class="mono b s12 c ca">REVIEW</text>
<text x="558.0" y="76" class="mu s11 c">Claude Opus 5.5, full</text>
<text x="558.0" y="91" class="mu s11 c">diff and prior findings</text>
<text x="714.0" y="134" class="mono b s12 c ca">ADVISORY</text>
<text x="714.0" y="76" class="mu s11 c">GPT Sol, high-risk only,</text>
<text x="714.0" y="91" class="mu s11 c">sees no prior findings</text>
<text x="870.0" y="134" class="mono b s12 c">LOCAL_REVIEWED</text>
<text x="870.0" y="76" class="mu s11 c">handed back to</text>
<text x="870.0" y="91" class="mu s11 c">the batch loop</text>
<text x="246" y="206" class="b c">bad patch</text>
<text x="246" y="223" class="mu s11 c">back with the</text>
<text x="246" y="237" class="mu s11 c">parser error</text>
<text x="402" y="206" class="b c">failed check</text>
<text x="402" y="223" class="mu s11 c">back with ≤8,000 chars</text>
<text x="402" y="237" class="mu s11 c">of its failure blocks</text>
<text x="558" y="206" class="b c">blocking finding</text>
<text x="558" y="223" class="mu s11 c">back with the</text>
<text x="558" y="237" class="mu s11 c">findings themselves</text>
<text x="104" y="293" class="s12">back to a fresh IMPLEMENT call with only that evidence: one correction, at most 2</text>
<text x="104" y="309" class="mu">each return is a new process, not a resumed session</text>
<text x="38" y="354" class="b s12 cs">STOPPED</text>
<text x="38" y="374" class="cs">more than 2 corrections · more than 6 calls (7 with advisory)</text>
<text x="38" y="389" class="cs">empty patch · out-of-scope file</text>
<text x="724" y="262" class="mu s11">a blocking advisory finding</text>
<text x="724" y="276" class="mu s11">never starts a correction</text>
<text x="510" y="354" class="b s12 cs">STOPPED for owner review</text>
<text x="510" y="374" class="cs">the advisory review raised a blocking finding; the reviewed</text>
<text x="510" y="389" class="cs">candidate is kept and no PR is opened</text>
<text x="870" y="176" class="mu s11 c">non-blocking findings</text>
<text x="870" y="190" class="mu s11 c">travel in the PR body</text>
<text x="870" y="204" class="mu s11 c">as reviewer notes</text>
<text x="38" y="448" class="b s12 cr">Every attempt, however it ends, becomes a run record for the router · figure 4</text>
<text x="38" y="467" class="mu">label (one_pass, corrected, blocked, failed_checks, no_patch) · correction rounds · tokens per role · seconds</text>
<text x="42" y="506" class="mu s11">model call: the only place tokens are spent</text>
<text x="320.79999999999995" y="506" class="mu s11">plain Python</text>
<text x="425.99999999999994" y="506" class="mu s11">stop</text>
<text x="486.3999999999999" y="506" class="mu s11">router: learned from outcomes, no model call of its own</text>
</svg>
