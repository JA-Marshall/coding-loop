<svg xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, system-ui, sans-serif" viewBox="0 0 960 380" role="img" aria-label="Inside one packet the runner calls a worker model for a patch, applies it to owned files only, runs the prescribed checks, then calls a reviewer model on the full diff; a bad patch, failed check, or blocking finding sends bounded evidence back to a fresh worker call, at most two corrections and six calls, after which the candidate is handed back as LOCAL_REVIEWED or the run stops.">
    <defs>
      <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F2126"/></marker>
      <marker id="a2s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B5433A"/></marker>
    </defs><rect x="0" y="0" width="960" height="380" fill="#ECEAE3"/>
    <g fill="none" stroke="#1F2126" stroke-width="1.5">
      <rect x="20" y="50" width="130" height="48" rx="4" fill="#F7E7CF" stroke="#B86E14" stroke-width="2"/>
      <rect x="180" y="50" width="130" height="48" rx="4" fill="#F5F3EE"/>
      <rect x="340" y="50" width="130" height="48" rx="4" fill="#F5F3EE"/>
      <rect x="500" y="50" width="130" height="48" rx="4" fill="#F7E7CF" stroke="#B86E14" stroke-width="2"/>
      <rect x="660" y="50" width="130" height="48" rx="4" fill="#F7E7CF" stroke="#B86E14" stroke-width="2" stroke-dasharray="5 4"/>
      <rect x="820" y="50" width="120" height="48" rx="4" fill="#F5F3EE"/>
      <path d="M150 74H178" marker-end="url(#a2)"/>
      <path d="M310 74H338" marker-end="url(#a2)"/>
      <path d="M470 74H498" marker-end="url(#a2)"/>
      <path d="M630 74H658" marker-end="url(#a2)"/>
      <path d="M790 74H818" marker-end="url(#a2)"/>
      <!-- corrections back to IMPLEMENT -->
      <path d="M245 98V180H85V100" marker-end="url(#a2)"/>
      <path d="M405 98V216H85" stroke-dasharray="0"/>
      <path d="M565 98V252H85"/>
      <!-- stop arrows -->
      <path d="M725 98V300" stroke="#B5433A" marker-end="url(#a2s)"/>
      <path d="M40 98V300" stroke="#B5433A" marker-end="url(#a2s)"/>
      <rect x="20" y="302" width="300" height="52" rx="4" fill="#F6DEDB" stroke="#B5433A"/>
      <rect x="600" y="302" width="340" height="52" rx="4" fill="#F6DEDB" stroke="#B5433A"/>
    </g>
    <g fill="#1F2126" font-size="12">
      <g font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="500" text-anchor="middle">
        <text x="85" y="78" fill="#B86E14">IMPLEMENT</text>
        <text x="245" y="78">APPLYING</text>
        <text x="405" y="78">CHECKS</text>
        <text x="565" y="78" fill="#B86E14">REVIEW</text>
        <text x="725" y="78" fill="#B86E14">ADVISORY</text>
        <text x="880" y="78">LOCAL_REVIEWED</text>
      </g>
      <g fill="#6B6E76" font-size="10.5" text-anchor="middle">
        <text x="85" y="36">worker model, fresh process</text>
        <text x="245" y="36">apply patch to owned files only</text>
        <text x="405" y="36">prescribed argv: tests, validator</text>
        <text x="565" y="36">Claude Opus 5.5, full diff</text>
        <text x="725" y="36">GPT Sol, high-risk packets only</text>
        <text x="880" y="36">hand back to batch</text>
      </g>
      <text x="245" y="118" text-anchor="middle" font-size="10.5" fill="#6B6E76">returns {patch, summary}</text>
      <text x="565" y="118" text-anchor="middle" font-size="10.5" fill="#6B6E76">sees prior blocking findings</text>
      <text x="725" y="118" text-anchor="middle" font-size="10.5" fill="#6B6E76">independent, no prior findings</text>
      <g font-size="11">
        <text x="255" y="176">bad patch format → back with the parser error</text>
        <text x="415" y="212">failed checks → back with ≤8,000 chars of the failure blocks</text>
        <text x="575" y="248">blocking findings → back with the findings, correction + 1</text>
      </g>
      <text x="95" y="290" fill="#6B6E76" font-size="10.5">each return is a new fresh process, not a resumed session</text>
      <g fill="#B5433A">
        <text x="32" y="322" font-weight="500">STOPPED</text>
        <text x="32" y="338" font-size="10.5">corrections &gt; 2 · calls &gt; 6 (7 with advisory) · empty patch · out-of-scope file</text>
        <text x="612" y="322" font-weight="500">STOPPED for owner review</text>
        <text x="612" y="338" font-size="10.5">advisory raised a blocking finding; reviewed candidate kept, no PR opened</text>
      </g>
    </g>
  </svg>