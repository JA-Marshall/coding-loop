<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 528" role="img" aria-label="Inside one packet the runner calls a worker model for a patch, applies it to the owned files only, runs the prescribed checks, then calls a reviewer model on the full diff. A bad patch, a failed check or a blocking finding sends bounded evidence back to a fresh worker call, at most two corrections and six calls. High-risk packets get an independent advisory review whose blocking finding stops the run for the owner. Otherwise the candidate is handed back as LOCAL_REVIEWED. Every attempt becomes a run record for the router.">
<style>text{font-family:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:11.5px;fill:#1F2126}.mono{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.b{font-weight:600}.mu{fill:#5C5F67}.c{text-anchor:middle}.e{text-anchor:end}.s9{font-size:9.5px;letter-spacing:.05em}.s10{font-size:10.5px}.s11{font-size:11px}.s12{font-size:12.5px}.s13{font-size:13px}.s15{font-size:15px}.ca{fill:#7E4706}.cg{fill:#24507F}.cs{fill:#96291F}.cr{fill:#4E3590}</style>
