<svg xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, system-ui, sans-serif" viewBox="0 0 960 350" role="img" aria-label="The batch supervisor moves each packet through PREPARE, RUN, COMMIT, PUSH, PR, CI and MERGE, then loops back to PREPARE for the next packet from refreshed origin/main, checkpointing state after every phase and stopping on any budget or gate failure.">
    <defs>
      <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F2126"/></marker>
      <marker id="a1s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B5433A"/></marker>
    </defs><rect x="0" y="0" width="960" height="350" fill="#ECEAE3"/>
    <g fill="none" stroke="#1F2126" stroke-width="1.5">
      <!-- GitHub region -->
      <rect x="370" y="88" width="490" height="76" rx="6" stroke="#3D6FA8" stroke-dasharray="5 4" fill="#E1EAF5"/>
      <!-- manifest -->
      <rect x="20" y="20" width="220" height="40" rx="4" fill="#F5F3EE"/>
      <!-- phases -->
      <rect x="20" y="104" width="100" height="44" rx="4" fill="#F5F3EE"/>
      <rect x="140" y="104" width="100" height="44" rx="4" fill="#F7E7CF" stroke="#B86E14" stroke-width="2"/>
      <rect x="260" y="104" width="100" height="44" rx="4" fill="#F5F3EE"/>
      <rect x="380" y="104" width="100" height="44" rx="4" fill="#F5F3EE"/>
      <rect x="500" y="104" width="100" height="44" rx="4" fill="#F5F3EE"/>
      <rect x="620" y="104" width="100" height="44" rx="4" fill="#F5F3EE"/>
      <rect x="740" y="104" width="100" height="44" rx="4" fill="#F5F3EE"/>
      <rect x="870" y="104" width="80" height="44" rx="4" fill="#F5F3EE"/>
      <!-- checkpoint -->
      <rect x="20" y="256" width="620" height="40" rx="4" fill="#F5F3EE"/>
      <!-- stop -->
      <rect x="660" y="256" width="290" height="74" rx="4" fill="#F6DEDB" stroke="#B5433A"/>
      <!-- flow arrows -->
      <path d="M70 60V102" marker-end="url(#a1)"/>
      <path d="M120 126H138" marker-end="url(#a1)"/>
      <path d="M240 126H258" marker-end="url(#a1)"/>
      <path d="M360 126H378" marker-end="url(#a1)"/>
      <path d="M480 126H498" marker-end="url(#a1)"/>
      <path d="M600 126H618" marker-end="url(#a1)"/>
      <path d="M720 126H738" marker-end="url(#a1)"/>
      <path d="M840 126H868" marker-end="url(#a1)"/>
      <!-- CI poll self-loop -->
      <path d="M690 104C690 86 720 86 720 104" marker-end="url(#a1)"/>
      <!-- loop back -->
      <path d="M790 148V218H70V150" marker-end="url(#a1)"/>
      <!-- checkpoint ticks -->
      <path d="M330 148V254" stroke-dasharray="3 4"/>
      <!-- stop arrow from loop -->
      <path d="M430 218V254" stroke="#B5433A" marker-end="url(#a1s)" stroke-dasharray="3 4" opacity="0"/>
    </g>
    <g fill="#1F2126" font-size="12">
      <text x="30" y="37" font-weight="500">manifest from ebay_queue.json</text>
      <text x="30" y="52" fill="#6B6E76" font-size="11">4 packets, hashed and frozen at start</text>
      <text x="78" y="86" fill="#6B6E76" font-size="11">packet i</text>
      <g font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="500" text-anchor="middle">
        <text x="70" y="130">PREPARE</text>
        <text x="190" y="130" fill="#B86E14">RUN</text>
        <text x="310" y="130">COMMIT</text>
        <text x="430" y="130">PUSH</text>
        <text x="550" y="130">PR</text>
        <text x="670" y="130">CI</text>
        <text x="790" y="130">MERGE</text>
        <text x="910" y="130">COMPLETE</text>
      </g>
      <text x="380" y="82" fill="#3D6FA8" font-size="11" font-weight="500">GitHub API, no model tokens</text>
      <text x="705" y="80" fill="#6B6E76" font-size="10">poll ≤30s, ≤1h</text>
      <g fill="#6B6E76" font-size="10.5" text-anchor="middle">
        <text x="70" y="166">plan DRAFT → READY</text>
        <text x="70" y="179">→ IN_PROGRESS, validated</text>
        <text x="190" y="166">runner.py, figure 2</text>
        <text x="190" y="179">worker + review calls</text>
        <text x="310" y="166">plan COMPLETE,</text>
        <text x="310" y="179">ACTIVE cleared</text>
        <text x="430" y="182">exact ref, never force</text>
        <text x="550" y="182">create or reuse PR</text>
        <text x="670" y="182">required check on head</text>
        <text x="790" y="182">API merge, exact SHA</text>
        <text x="910" y="166">last packet</text>
        <text x="910" y="179">merged</text>
      </g>
      <text x="430" y="212" text-anchor="middle" font-size="11">next packet: index + 1, checkout refreshed from origin/main after the verified merge</text>
      <text x="30" y="273" font-weight="500">state.json checkpoint written after every phase</text>
      <text x="30" y="288" fill="#6B6E76" font-size="11">restart reconciles scoped local writes and remote PR/merge facts; never a second writer, never a replay of an ambiguous call</text>
      <text x="338" y="246" fill="#6B6E76" font-size="10">every transition</text>
      <text x="672" y="274" fill="#B5433A" font-weight="500">STOPPED, evidence preserved</text>
      <g fill="#B5433A" font-size="10.5">
        <text x="672" y="291">STOP file · 8h deadline · 24 calls · 4M tokens</text>
        <text x="672" y="305">failed or stale CI · changes requested · branch moved</text>
        <text x="672" y="319">supervisor files changed · unknown usage</text>
      </g>
    </g>
  </svg>