<rect x="38" y="186" width="242" height="42" rx="4" fill="#15171C" stroke="#474B57" stroke-width="1.25"/>
<rect x="38" y="234" width="242" height="42" rx="4" fill="#15171C" stroke="#474B57" stroke-width="1.25"/>
