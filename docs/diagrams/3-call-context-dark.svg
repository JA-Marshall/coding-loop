<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 404" role="img" aria-label="The supervisor assembles a prompt from a role template, the packet, a manifest of owned file names and sizes, and bounded evidence, then starts a fresh restricted process with read-only tools over a source snapshot with agent config stripped out. The process returns a JSON result and nothing carries over to the next call.">
<style>text{font-family:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:11.5px;fill:#E9E7E1}.mono{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.b{font-weight:600}.mu{fill:#A4A7B0}.c{text-anchor:middle}.e{text-anchor:end}.s9{font-size:9.5px;letter-spacing:.05em}.s10{font-size:10.5px}.s11{font-size:11px}.s12{font-size:12.5px}.s13{font-size:13px}.s15{font-size:15px}.ca{fill:#F0BC74}.cg{fill:#9CC3EE}.cs{fill:#F0A29B}.cr{fill:#C6B4F2}</style>
<defs><marker id="head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0.5L10 5L0 9.5z" fill="#E9E7E1"/></marker><marker id="head-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0.5L10 5L0 9.5z" fill="#DD7168"/></marker><marker id="head-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0.5L10 5L0 9.5z" fill="#A48AE3"/></marker></defs>
