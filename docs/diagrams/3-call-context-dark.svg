<rect x="24" y="372" width="12" height="12" rx="3" fill="#33260F" stroke="#D9983F" stroke-width="1.25"/>
<rect x="302.79999999999995" y="372" width="12" height="12" rx="3" fill="#1E2128" stroke="#474B57" stroke-width="1.25"/>
<text x="24" y="34" class="b s15">One model call: what it can see</text>
<text x="936" y="34" class="e mu mono s11">isolated.py</text>
<text x="38" y="78" class="b s12">the supervisor builds the prompt</text>
<text x="48" y="107" class="mono b s11">TEMPLATE</text>
<text x="48" y="123" class="mu">worker.md or reviewer.md</text>
<text x="48" y="155" class="mono b s11">PACKET</text>
<text x="48" y="171" class="mu">objective, owned files, budgets</text>
<text x="48" y="203" class="mono b s11">MANIFEST</text>
<text x="48" y="219" class="mu">file names and byte sizes only</text>
<text x="48" y="251" class="mono b s11">EVIDENCE</text>
<text x="48" y="267" class="mu">≤8,000 chars, or the diff</text>
<text x="310" y="164" class="mu s10 c">stdin</text>
<text x="342" y="78" class="b s12 ca">one fresh process, empty context</text>
<text x="342" y="108" class="mono s11">claude -p --restricted --tools Read,Grep,Glob</text>
<text x="342" y="128" class="mono s11">codex exec --sandbox read-only</text>
<text x="342" y="148" class="mono s11">muse exec --no-session-log</text>
<text x="342" y="192" class="mu">reads only the symbols it needs</text>
<text x="342" y="212" class="mu">no write, shell, network or delegation</text>
<text x="342" y="232" class="mu">no --resume, no prior turns, no compaction</text>
<text x="342" y="252" class="mu">its output must match a JSON schema</text>
<text x="681" y="164" class="mu s10 c">reads</text>
<text x="712" y="78" class="b s12">read-only source snapshot</text>
<text x="712" y="100" class="mu">tracked files are copied, with</text>
<text x="712" y="115" class="mu">these stripped so nothing in the</text>
<text x="712" y="130" class="mu">repo can override the packet:</text>
<text x="712" y="158" class="mono s11">.claude/</text>
<text x="794" y="158" class="mono s11">CLAUDE.md</text>
<text x="712" y="176" class="mono s11">.codex/</text>
<text x="794" y="176" class="mono s11">.agents/</text>
<text x="712" y="194" class="mono s11">.git/</text>
<text x="794" y="194" class="mono s11">.github/</text>
<text x="712" y="212" class="mono s11">.env*</text>
<text x="712" y="240" class="mu">check logs live outside it, so</text>
<text x="712" y="255" class="mu">only the EVIDENCE excerpt</text>
<text x="712" y="270" class="mu">of them is visible</text>
<text x="510" y="310" class="mono s11">{patch, summary}  or  {findings[]}</text>
<text x="510" y="326" class="mu">parsed, size-capped, usage recorded</text>
<text x="24" y="358" class="s12">The next call starts from zero: only what the supervisor puts back into the prompt survives.</text>
<text x="42" y="382" class="mu s11">model call: the only place tokens are spent</text>
<text x="320.79999999999995" y="382" class="mu s11">plain Python</text>
</svg>
