<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="The planned routing loop. A predictor estimates the probability that a model pair finishes a packet in one pass. A contextual bandit then picks one of three actions: the cheap pair as posed, the expensive pair as posed, or the cheap pair after a smarter model splits the packet into sub-packets with disjoint file ownership. The inner loop runs the choice, and every attempt is written as a run record. The records train the predictor, update the bandit with reward success minus lambda times cost, and score each split so the decomposition policy improves. Run records exist today; the predictor, bandit and decomposer are planned.">
