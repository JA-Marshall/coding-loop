<text x="24" y="34" class="b s15">Routing loop: learn what a cheap pair can finish in one pass</text>
<text x="936" y="34" class="e mu mono s11">coding-loop-router</text>
<text x="38" y="82" class="mono b s13">PACKET</text>
<text x="38" y="101" class="mu">from the owner's queue,</text>
<text x="38" y="116" class="mu">or derived from a merged</text>
<text x="38" y="131" class="mu">PR, judged by its tests</text>
<text x="271" y="81.8" class="c b s10" fill="#15171C">1</text>
<text x="288" y="83" class="mono b s13 cr">PREDICT</text>
<text x="520.0" y="80" class="c b s9 cr">PLANNED</text>
<text x="264" y="106" class="mono s11">p(one_pass | packet features, pair)</text>
<text x="264" y="125" class="mu">calibrated; the features need no model call</text>
<text x="617" y="81.8" class="c b s10" fill="#15171C">2</text>
<text x="634" y="83" class="mono b s13 cr">ROUTE</text>
<text x="896.0" y="80" class="c b s9 cr">PLANNED</text>
<text x="610" y="106" class="mu">a contextual bandit over three actions:</text>
<text x="610" y="123" class="mu">Thompson sampling, a few % explored at random</text>
<text x="776" y="165" class="mu s10">picks one</text>
<text x="622" y="209" class="mono b s12">cheap_direct</text>
<text x="622" y="228" class="mu">the cheap pair attempts the packet as posed</text>
<text x="622" y="271" class="mono b s12">expensive_direct</text>
<text x="622" y="290" class="mu">the expensive pair attempts it as posed</text>
<text x="622" y="333" class="mono b s12">cheap_split</text>
<text x="622" y="352" class="mu">split first, then the cheap pair on each part</text>
<text x="640" y="385.8" class="c b s10" fill="#15171C">3</text>
<text x="655" y="386" class="mono b s11 ca">DECOMPOSE</text>
<text x="634" y="404" class="mu s11">a smarter model</text>
<text x="852" y="386" class="mu s11">disjoint file</text>
<text x="852" y="400" class="mu s11">ownership</text>
<text x="610" y="494" class="mono b s13 ca">RUN</text>
<text x="644" y="494" class="mu">the inner loop · figure 2</text>
<text x="610" y="514" class="mu">worker call, checks, then review on each part;</text>
<text x="610" y="529" class="mu">a split counts only if the union passes</text>
<text x="610" y="544" class="mu">the original packet's checks</text>
<text x="568" y="505" class="mu s10 c">outcome</text>
<text x="45" y="493.8" class="c b s10" fill="#15171C">0</text>
<text x="62" y="495" class="mono b s13">RUN RECORD</text>
<text x="152" y="495" class="mu">one JSON line per attempt</text>
<text x="510.0" y="492" class="c b s9">LIVE</text>
<text x="38" y="520" class="mu">label: one_pass · corrected · blocked · failed_checks · failed_ci · no_patch</text>
<text x="38" y="537" class="mu">correction rounds · tokens per role · seconds · usd_estimate at list prices</text>
<text x="85" y="199.8" class="c b s10" fill="#15171C">1</text>
<text x="102" y="200" class="b s12 cr">train the predictor</text>
<text x="78" y="221" class="mu">gradient-boosted trees on the logged records, scored by Brier and a</text>
<text x="78" y="236" class="mu">reliability diagram, leaving one repository out at a time</text>
<text x="85" y="283.8" class="c b s10" fill="#15171C">2</text>
<text x="102" y="284" class="b s12 cr">update the bandit</text>
<text x="78" y="305" class="mono s11">reward = success − λ · cost</text>
<text x="78" y="321" class="mu">off-policy evaluation on logged runs (IPS, doubly robust) comes first</text>
<text x="85" y="367.8" class="c b s10" fill="#15171C">3</text>
<text x="102" y="368" class="b s12 cr">score the split</text>
<text x="78" y="389" class="mono s11">reward = one-pass fraction × union passes − α·n − β·cost</text>
<text x="78" y="407" class="mu">a bandit over split prompts: by file, by test, by layer, by size;</text>
<text x="78" y="422" class="mu">winning splits become few-shot examples, weights only if that stalls</text>
<text x="42" y="590" class="mu s11">model call: the only place tokens are spent</text>
<text x="320.79999999999995" y="590" class="mu s11">plain Python</text>
<text x="425.99999999999994" y="590" class="mu s11">router: learned from outcomes, no model call of its own</text>
<text x="24" y="614" class="mu s11">LIVE today: run records and packets derived from merged pull requests.  PLANNED: stages 1 to 3, in coding-loop-router/docs/PLAN.md.</text>
</svg>
