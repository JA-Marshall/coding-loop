<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 552" role="img" aria-label="The batch supervisor takes each packet from a frozen manifest through PREPARE, ROUTE, RUN and COMMIT on the local machine, then PUSH, PR, CI and MERGE through the GitHub API, and loops back to PREPARE for the next packet from a refreshed origin/main. RUN runs the packet&#x27;s checks before any review, and CI is a second gate on the pushed head. ROUTE is planned: it predicts the odds of a one-pass merge and picks the model pair, or a split, before RUN. State is checkpointed after every phase, and any failed gate or spent budget stops the queue with its evidence kept.">
<style>text{font-family:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:11.5px;fill:#E9E7E1}.mono{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.b{font-weight:600}.mu{fill:#A4A7B0}.c{text-anchor:middle}.e{text-anchor:end}.s9{font-size:9.5px;letter-spacing:.05em}.s10{font-size:10.5px}.s11{font-size:11px}.s12{font-size:12.5px}.s13{font-size:13px}.s15{font-size:15px}.ca{fill:#F0BC74}.cg{fill:#9CC3EE}.cs{fill:#F0A29B}.cr{fill:#C6B4F2}</style>
