<text x="24" y="34" class="b s15">Outer loop: one pass per packet</text>
<text x="936" y="34" class="e mu mono s11">batch.py</text>
<text x="38" y="73" class="b s12">frozen manifest</text>
<text x="38" y="89" class="mu">4 packets, hashed at the start</text>
<text x="136" y="119" class="mu s11">packet i</text>
<text x="38" y="154" class="mono b s13">PREPARE</text>
<text x="38" y="173" class="mu">plan file DRAFT → READY →</text>
<text x="38" y="188" class="mu">IN_PROGRESS, validated</text>
<text x="274" y="154" class="mono b s13 cr">ROUTE</text>
<text x="274" y="173" class="mu">predict one-pass odds, pick</text>
<text x="274" y="188" class="mu">a pair or split · figure 4</text>
<text x="424.0" y="153" class="c b s9 cr">PLANNED</text>
<text x="510" y="154" class="mono b s13 ca">RUN</text>
<text x="510" y="173" class="mu">runner.py: patch, checks,</text>
<text x="510" y="188" class="mu">then review · figure 2</text>
<text x="746" y="154" class="mono b s13">COMMIT</text>
<text x="746" y="173" class="mu">plan marked COMPLETE,</text>
<text x="746" y="188" class="mu">ACTIVE cleared</text>
<text x="260" y="281" class="b cg">GitHub API, no model tokens</text>
<text x="746" y="314" class="mono b s13">PUSH</text>
<text x="746" y="333" class="mu">exact ref, never forced</text>
<text x="510" y="314" class="mono b s13">PR</text>
<text x="510" y="333" class="mu">create or reuse the PR</text>
<text x="274" y="314" class="mono b s13">CI</text>
<text x="274" y="333" class="mu">a second gate: the required</text>
<text x="274" y="348" class="mu">check on the pushed head</text>
<text x="38" y="314" class="mono b s13">MERGE</text>
<text x="38" y="333" class="mu">API merge of the exact SHA</text>
<text x="140" y="227" class="s12">next packet: index + 1, on a checkout refreshed</text>
<text x="140" y="243" class="s12">from origin/main after the verified merge</text>
<text x="38" y="428" class="mono b s13">COMPLETE</text>
<text x="38" y="447" class="mu">last packet merged</text>
<text x="430" y="392" class="mu s10">every transition</text>
<text x="274" y="426" class="b s12">state.json checkpoint after every phase</text>
<text x="274" y="446" class="mu">a restart reconciles local writes with the</text>
<text x="274" y="461" class="mu">remote PR state: never a second writer,</text>
<text x="274" y="476" class="mu">never a replay of an ambiguous call</text>
<text x="709" y="392" class="cs s10">any failed gate or spent budget</text>
<text x="628" y="426" class="b s12 cs">STOPPED, evidence preserved</text>
<text x="628" y="446" class="cs">STOP file · 8 h deadline · 24 calls</text>
<text x="628" y="461" class="cs">4M tokens · unknown usage · branch moved</text>
<text x="628" y="476" class="cs">failed or stale CI · changes requested</text>
<text x="628" y="491" class="cs">supervisor files changed</text>
<text x="42" y="530" class="mu s11">model call: the only place tokens are spent</text>
<text x="320.79999999999995" y="530" class="mu s11">plain Python</text>
<text x="425.99999999999994" y="530" class="mu s11">GitHub API</text>
<text x="520.0" y="530" class="mu s11">stop</text>
<text x="580.4" y="530" class="mu s11">router: learned from outcomes, no model call of its own</text>
</svg>
